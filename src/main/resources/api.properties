# ─────────────────────────────────────────────────────────────────────────────
# Aviationstack API Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Get your free API key at: https://aviationstack.com/signup
# Free plan: 100 requests/month, HTTP only
# Basic plan ($49.99/mo): 10,000 requests/month, HTTPS, historical data

# Your API access key (REQUIRED for live data)
aviationstack.api.key=2a301ac938ceb5c86103558833401bd6

# Base URL — Free plan uses HTTP; paid plans can use HTTPS
aviationstack.base.url=http://api.aviationstack.com/v1

# Default airport IATA code to sync flights for
aviationstack.default.airport=HYD

# ─────────────────────────────────────────────────────────────────────────────
# Smart Sync Intervals (in minutes)
# ─────────────────────────────────────────────────────────────────────────────
# Real-time flight status — higher priority, more frequent
sync.interval.flight.status=30

# Flight schedules — static data, sync once daily
sync.interval.schedules=1440

# Airport/airline reference data — very static, sync weekly
sync.interval.reference=10080

# ─────────────────────────────────────────────────────────────────────────────
# Cache Settings
# ─────────────────────────────────────────────────────────────────────────────
# Time-to-live for cached flight data (in minutes)
cache.ttl.flights=15

# Time-to-live for cached reference data — airports/airlines (in minutes)
cache.ttl.reference=1440

# Maximum number of flights to keep in cache
cache.max.flights=500

# ─────────────────────────────────────────────────────────────────────────────
# Quota Management
# ─────────────────────────────────────────────────────────────────────────────
# Monthly API call limit (Free=100, Basic=10000, Pro=50000)
quota.monthly.limit=100

# Enable automatic fallback to mock data when quota is low
quota.fallback.enabled=true

# Remaining calls threshold to trigger fallback
quota.fallback.threshold=10
